<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Drinkit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">

  <a href="index.html" class="brand">
    <span class="brand-icon">⚡</span>
    Drinkit
  </a>

  <a href="products.html" class="back-link">
    ← Continue Shopping
  </a>

</header>


<main class="cart-page">

  <h1>Your Cart 🛒</h1>

  <div class="cart-layout">

    <section class="cart-container">

      <div id="cartItems"></div>

    </section>


    <aside class="bill">

      <h2>Bill Details</h2>

      <div class="bill-row">
        <span>Item Total</span>
        <strong id="itemTotal">₹0</strong>
      </div>

      <div class="bill-row">
        <span>Delivery Fee</span>
        <strong id="deliveryFee">₹0</strong>
      </div>

      <div class="bill-row">
        <span>Handling Fee</span>
        <strong id="handlingFee">₹5</strong>
      </div>

      <hr>

      <div class="bill-row grand-total">
        <span>Grand Total</span>
        <strong id="grandTotal">₹0</strong>
      </div>

      <a
        href="checkout.html"
        id="checkoutLink"
        class="checkout-btn"
      >
        Proceed to Checkout
      </a>

    </aside>

  </div>

</main>


<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
