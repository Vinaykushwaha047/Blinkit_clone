<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Drinkit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">

  <a href="index.html" class="brand">
    <span class="brand-icon">⚡</span>
    Drinkit
  </a>

  <div class="location">
    <small>Delivering to</small>
    <strong id="locationText">Huzurganj</strong>
  </div>

  <div class="search-box">
    🔍
    <input
      id="productSearch"
      type="text"
      placeholder="Search products..."
    >
  </div>

  <a href="cart.html" class="cart-button">
    🛒 Cart
    <span id="cartCount">0</span>
  </a>

</header>


<main class="products-page">

  <div class="page-title">
    <div>
      <h1>All Products</h1>
      <p id="resultText">Showing all products</p>
    </div>

    <select id="sortSelect">
      <option value="default">Sort by</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>


  <div class="products-layout">

    <aside class="sidebar">

      <h3>Categories</h3>

      <button onclick="filterProducts('all')">
        All Products
      </button>

      <button onclick="filterProducts('fruits')">
        🍎 Fruits
      </button>

      <button onclick="filterProducts('vegetables')">
        🥦 Vegetables
      </button>

      <button onclick="filterProducts('dairy')">
        🥛 Dairy
      </button>

      <button onclick="filterProducts('snacks')">
        🍪 Snacks
      </button>

      <button onclick="filterProducts('beverages')">
        🧃 Beverages
      </button>

      <button onclick="filterProducts('personal')">
        🧴 Personal Care
      </button>

    </aside>


    <section>
      <div id="productsContainer" class="product-grid"></div>
    </section>

  </div>

</main>


<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
